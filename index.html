<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伏せ将棋｜コア試作</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    /* 画面全体を横9列×縦13行で割る：上1行（手番＋CPU持ち駒）＋盤9行＋持ち駒1行＋ボタン1行＋下1行（空白） */
    --cw: calc(100vw / 9);
    --ch: calc(100dvh / 13);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    /* 黒漆の背景：中心がほのかに明るく、四隅が沈むラッカー調。金粉を散らしたような点も */
    background:
      radial-gradient(circle at 8% 12%, rgba(255, 216, 130, .28) 0 1.2px, transparent 2px),
      radial-gradient(circle at 91% 9%, rgba(255, 216, 130, .22) 0 1px, transparent 1.8px),
      radial-gradient(circle at 16% 88%, rgba(255, 216, 130, .20) 0 1px, transparent 1.8px),
      radial-gradient(circle at 84% 93%, rgba(255, 216, 130, .26) 0 1.3px, transparent 2.2px),
      radial-gradient(circle at 96% 46%, rgba(255, 216, 130, .16) 0 1px, transparent 1.8px),
      radial-gradient(circle at 4% 58%, rgba(255, 216, 130, .16) 0 1px, transparent 1.8px),
      radial-gradient(ellipse 120% 60% at 50% 0%, rgba(214, 164, 65, .13), transparent 55%),
      radial-gradient(ellipse 90% 55% at 50% 108%, rgba(214, 164, 65, .08), transparent 60%),
      radial-gradient(ellipse 140% 120% at 50% 45%, #3d2a16 0%, #241708 55%, #120b04 100%);
    color: #f5ead6;
    display: flex; flex-direction: column; align-items: center;
    height: 100dvh; overflow: hidden;
  }
  /* 金箔の額縁：画面の縁に二重の金の線を回す（タップは邪魔しない） */
  body::before {
    content: ""; position: fixed; inset: 7px; z-index: 40; pointer-events: none;
    border: 1px solid rgba(238, 198, 96, .30); border-radius: 4px;
  }
  body::after {
    content: ""; position: fixed; inset: 3px; z-index: 40; pointer-events: none;
    border: 1px solid rgba(238, 198, 96, .60); border-radius: 6px;
    box-shadow: inset 0 0 18px rgba(0, 0, 0, .35);
  }
  /* 勝ったときは盤全体が金色にほのかに輝く */
  body.won #board {
    box-shadow:
      inset 0 0 0 2px rgba(255, 238, 190, .5),
      inset 0 0 26px rgba(122, 74, 14, .35),
      0 3px 0 #96682a, 0 6px 0 #6f4517,
      0 0 52px rgba(255, 196, 64, .55), 0 14px 28px rgba(0,0,0,.6);
  }
  #status.win {
    background: linear-gradient(#fff3b0, #ffd23e 55%, #e9a812);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(255, 190, 60, .5));
  }
  .topRow, .bottomRow {
    height: var(--ch); width: 100vw;
    display: flex; align-items: center; justify-content: space-between;
    flex: 0 0 auto; padding: 0 4px; gap: 6px;
  }
  .bottomRow { justify-content: center; }
  /* 上の行は駒台風の帯：下端に金の細線 */
  .topRow {
    background: linear-gradient(#43301b, #2c1e0f);
    box-shadow: inset 0 -1px 0 rgba(232, 190, 92, .55), inset 0 -6px 8px -6px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  }
  /* 下のボタン行も駒台風のパネルにして、画面全体を家具のように囲う */
  .bottomRow {
    background:
      repeating-linear-gradient(93deg, rgba(0,0,0,.12) 0 2px, transparent 2px 9px),
      linear-gradient(#3a2812, #241708);
    box-shadow: inset 0 1px 0 rgba(232, 190, 92, .55), inset 0 8px 10px -8px rgba(0,0,0,.85);
  }
  /* 持ち駒専用の行：画面幅いっぱいを使い、入りきらない場合は2段に折り返す。駒台の木目調トレイにする */
  .handRow {
    height: var(--ch); width: 100vw;
    display: flex; align-items: center;
    flex: 0 0 auto; padding: 2px 4px;
    background:
      repeating-linear-gradient(93deg, rgba(0,0,0,.14) 0 2px, transparent 2px 9px),
      linear-gradient(#4a3520, #31220f);
    box-shadow: inset 0 1px 0 rgba(232, 190, 92, .55), inset 0 8px 10px -8px rgba(0,0,0,.9), inset 0 -8px 10px -8px rgba(0,0,0,.7);
  }
  #status { flex: 1; }
  .hand { display: flex; gap: 3px; align-items: center; overflow: hidden; flex-wrap: nowrap; }
  #playerHand { flex-wrap: wrap; row-gap: 2px; overflow: visible; }
  .handSpacer { min-width: 8px; }
  .chip {
    border-radius: 5px; padding: 1px 5px; font-weight: bold; white-space: nowrap; line-height: 1.3;
    font-size: calc(min(var(--cw), var(--ch)) * 0.30);
    background: linear-gradient(#ffe9b8, #eec887 55%, #dfae5c);
    color: #3a2410; border: 1px solid #a97c2f;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65), inset 0 -1px 0 rgba(120,72,10,.35), 0 1px 3px rgba(0,0,0,.5);
  }
  .chip.cpu {
    background: linear-gradient(#4c3a22, #2a1c0c 60%, #1c1106);
    color: #eec887; border: 1px solid rgba(232, 190, 92, .5);
    font-size: calc(min(var(--cw), var(--ch)) * 0.26);
    box-shadow: inset 0 1px 0 rgba(255,235,190,.22), 0 1px 3px rgba(0,0,0,.5);
  }
  .chip.selectable { cursor: pointer; }
  .chip.selected {
    border: 2px solid #e33f2e; background: linear-gradient(#fff3c4, #ffd964);
    box-shadow: 0 0 8px rgba(255, 205, 80, .85), inset 0 1px 0 rgba(255,255,255,.7);
  }
  /* 一番下の1行は完全に空けて、スマホのシステムボタンと重ならないようにする */
  .bottomBlank { height: var(--ch); width: 100vw; flex: 0 0 auto; }
  #status {
    font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", serif;
    font-size: calc(min(var(--cw), var(--ch)) * 0.38); font-weight: bold; text-align: center;
    color: #ffd977; white-space: normal; overflow: hidden; line-height: 1.2;
    max-width: 96vw;
    text-shadow: 0 1px 3px rgba(0,0,0,.75), 0 0 14px rgba(255, 190, 60, .30);
  }
  #board {
    display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
    gap: 0;
    /* 本榧の盤：木目＋星（交点の点）＋金色に光る面。斜めのツヤと、木の節のような濃淡も重ねる */
    background:
      linear-gradient(112deg, transparent 42%, rgba(255, 252, 238, .13) 50%, transparent 60%),
      radial-gradient(ellipse 130% 90% at 50% 0%, rgba(255, 246, 214, .35), transparent 55%),
      radial-gradient(ellipse 20% 9% at 24% 28%, rgba(146, 94, 32, .12), transparent 70%),
      radial-gradient(ellipse 16% 8% at 74% 66%, rgba(146, 94, 32, .10), transparent 70%),
      radial-gradient(circle at 33.333% 33.333%, rgba(96, 54, 12, .8) 0 3.5px, transparent 4.5px),
      radial-gradient(circle at 66.666% 33.333%, rgba(96, 54, 12, .8) 0 3.5px, transparent 4.5px),
      radial-gradient(circle at 33.333% 66.666%, rgba(96, 54, 12, .8) 0 3.5px, transparent 4.5px),
      radial-gradient(circle at 66.666% 66.666%, rgba(96, 54, 12, .8) 0 3.5px, transparent 4.5px),
      repeating-linear-gradient(94deg, rgba(146, 94, 32, .055) 0 2px, transparent 2px 8px),
      repeating-linear-gradient(89deg, rgba(255, 240, 200, .05) 0 1px, transparent 1px 5px),
      linear-gradient(160deg, #f4cf8e 0%, #ecbd72 42%, #e3ab58 78%, #dca34e 100%);
    border: 2px solid #7a4d1c;
    /* 板の厚み：下に2段の側面色＋落影で、盤が台の上に載っているように見せる */
    box-shadow:
      inset 0 0 0 2px rgba(255, 238, 190, .35),
      inset 0 0 26px rgba(122, 74, 14, .35),
      0 3px 0 #96682a, 0 6px 0 #6f4517,
      0 14px 28px rgba(0,0,0,.6);
    width: 100vw; height: calc(var(--ch) * 9);
    flex: 0 0 auto;
  }
  .cell {
    border: 1px solid rgba(101, 58, 14, .62); position: relative;
    min-width: 0; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .15s ease;
  }
  /* 直前に指されたマスの、金色の余韻（選択の金・王手の赤より淡く） */
  .cell.lastMove {
    background: radial-gradient(circle at 50% 45%, rgba(255, 216, 110, .42), rgba(255, 192, 64, .16) 72%, transparent);
  }
  .cell.movable::after {
    content: ""; position: absolute; width: 30%; height: 30%;
    border-radius: 50%; pointer-events: none;
    background: rgba(38, 110, 46, .28);
    border: 2px solid rgba(30, 105, 42, .75);
    box-shadow: 0 0 6px rgba(46, 140, 60, .45);
  }
  .cell.attackable {
    box-shadow: inset 0 0 0 3px rgba(206, 44, 26, .9), inset 0 0 12px rgba(206, 44, 26, .45);
  }
  .cell.selected {
    background: radial-gradient(circle at 50% 42%, rgba(255, 226, 140, .95), rgba(255, 196, 74, .65) 70%, rgba(255, 180, 40, .35));
    box-shadow: inset 0 0 0 2px rgba(166, 110, 14, .85), inset 0 0 14px rgba(255, 214, 100, .8);
  }
  /* 候補を表示している伏せ駒の印（青いリング。王手の赤・選択の金と区別する） */
  .cell.hinted {
    box-shadow: inset 0 0 0 3px rgba(64, 140, 220, .95), inset 0 0 12px rgba(64, 140, 220, .45);
  }
  /* 候補ボタンのような脇役ボタンは黒漆調にして、主ボタン（はじめから）と区別する */
  button.subBtn {
    font-size: calc(min(var(--cw), var(--ch)) * 0.30); padding: 0 7px;
    background: linear-gradient(#54401e 0%, #38280f 55%, #271a08 100%);
    color: #ffd977; border-color: #a37c22;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
    box-shadow: inset 0 1px 0 rgba(255, 220, 130, .35), inset 0 -2px 0 rgba(0,0,0,.5), 0 3px 9px rgba(0,0,0,.5);
  }
  button.subBtn:active { background: linear-gradient(#38280f, #241806); }
  button.subBtn.off { color: #b3a284; }
  .piece {
    /* 駒そのものの形が崩れないよう、大きさはマスの短い辺に合わせる */
    width: calc(min(var(--cw), var(--ch)) * 0.88);
    height: calc(min(var(--cw), var(--ch)) * 1.02);
    clip-path: polygon(50% 0%, 100% 24%, 87% 100%, 13% 100%, 0% 24%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", serif;
    font-weight: bold; user-select: none; pointer-events: none;
    font-size: calc(min(var(--cw), var(--ch)) * 0.5);
    position: relative;
    filter: drop-shadow(0 2px 2px rgba(62, 32, 0, .5));
  }
  /* 駒の表面のツヤ（ラッカーの光） */
  .piece::before {
    content: ""; position: absolute; inset: 0;
    clip-path: polygon(50% 0%, 100% 24%, 87% 100%, 13% 100%, 0% 24%);
    background: radial-gradient(ellipse 75% 42% at 50% 10%, rgba(255,255,255,.5), rgba(255,255,255,.06) 55%, transparent 75%);
    pointer-events: none;
  }
  .piece span { text-shadow: 0 1px 0 rgba(255, 246, 220, .55), 0 -1px 1px rgba(90, 50, 0, .28); }
  .piece.player {
    background:
      repeating-linear-gradient(96deg, rgba(150, 96, 30, .05) 0 2px, transparent 2px 7px),
      linear-gradient(#fff3c8 0%, #f8da96 38%, #eec26a 72%, #dfa544 100%);
    color: #3d2509;
  }
  .piece.cpu { transform: rotate(180deg); }
  .piece.cpu.known {
    /* 茜色の木：相手の表向きの駒も高級木材の質感に */
    background:
      repeating-linear-gradient(96deg, rgba(120, 44, 18, .06) 0 2px, transparent 2px 7px),
      linear-gradient(#f8d2b6 0%, #edae85 38%, #db8f5e 72%, #c97a49 100%);
    color: #451c08;
  }
  .piece.cpu.hidden {
    /* 黒漆の裏面：金の菱紋を中央に */
    background:
      radial-gradient(ellipse 80% 46% at 50% 8%, rgba(255, 226, 150, .22), transparent 60%),
      linear-gradient(#54401f 0%, #2e1f0e 48%, #150c03 100%);
    box-shadow: inset 0 0 0 2px rgba(232, 190, 92, .34);
  }
  /* 伏せ駒の表面には、ゆっくり光が流れる（ラッカーのツヤ） */
  .piece.cpu.hidden::before {
    background: linear-gradient(112deg, transparent 32%, rgba(255, 232, 170, .20) 48%, transparent 64%);
    background-size: 260% 100%;
    animation: hiddenSheen 4.8s ease-in-out infinite;
  }
  @keyframes hiddenSheen {
    0% { background-position: 130% 0; }
    55%, 100% { background-position: -70% 0; }
  }
  .piece.cpu.hidden::after {
    content: ""; position: absolute; left: 50%; top: 54%;
    width: 30%; aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%) rotate(45deg);
    border: 2px solid rgba(238, 198, 96, .95);
    background: radial-gradient(circle, rgba(255, 226, 140, .85) 0 1.6px, rgba(238, 198, 96, .25) 3px, transparent 4.5px);
    box-shadow: 0 0 7px rgba(238, 198, 96, .55), inset 0 0 5px rgba(238, 198, 96, .5), 0 0 0 3.5px rgba(238, 198, 96, .16);
    pointer-events: none;
  }
  .piece.cpu.hidden span { visibility: hidden; }
  .piece.promoted span { color: #bc2b18; text-shadow: 0 0 1px rgba(188, 43, 24, .35), 0 1px 0 rgba(255, 246, 220, .4); }
  .piece span.small { font-size: 0.58em; letter-spacing: -0.06em; }
  #promoOverlay, #settingsOverlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(8, 4, 0, .62);
    display: flex; align-items: center; justify-content: center;
  }
  #promoOverlay.hidden, #settingsOverlay.hidden { display: none; }
  .boxTitle {
    font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", serif;
    font-size: 17px; font-weight: bold; margin-bottom: 14px; color: #ffd977;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }
  .setLabel { color: #e8cf8e; font-size: 14px; }
  .setRow { margin-bottom: 8px; }
  #settingsOverlay .promoBtns { margin-bottom: 12px; }
  /* ステータスの下に戦績を小さく出すための縦積み */
  .statusCol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
  #statsLine {
    font-size: calc(min(var(--cw), var(--ch)) * 0.23); color: rgba(255, 217, 119, .75);
    line-height: 1.2; white-space: nowrap; min-height: 1em;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  /* 下段のボタン群（対局中／終局後／感想戦で出し分ける） */
  .btnGroup { display: flex; gap: 5px; justify-content: center; align-items: center; width: 100%; }
  .btnGroup.hidden { display: none; }
  #revPos { color: #ffd977; font-weight: bold; font-size: calc(min(var(--cw), var(--ch)) * 0.30); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .promoBox {
    background: linear-gradient(#43301b, #241708);
    border: 2px solid #d9ab4a; border-radius: 14px;
    outline: 1px solid rgba(217, 171, 74, .45); outline-offset: 4px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 26px rgba(217, 171, 74, .35), 0 14px 34px rgba(0,0,0,.6);
    padding: 20px 26px; text-align: center;
  }
  #promoText {
    font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "YuMincho", "Yu Mincho", serif;
    font-size: 17px; font-weight: bold; margin-bottom: 14px; color: #ffd977;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }
  .promoBtns { display: flex; gap: 12px; justify-content: center; }
  .promoBtns button { height: 48px; font-size: 16px; }
  button {
    font-size: calc(min(var(--cw), var(--ch)) * 0.36); padding: 0 10px; border: 1px solid #8a5f14; border-radius: 10px;
    background: linear-gradient(#f0cd6d 0%, #d9ab3c 48%, #bd8a24 100%);
    color: #382305; font-weight: bold; cursor: pointer;
    height: calc(var(--ch) * 0.64); white-space: nowrap;
    letter-spacing: .1em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 0 rgba(96, 58, 0, .5), 0 3px 9px rgba(0,0,0,.5);
    text-shadow: 0 1px 0 rgba(255, 244, 200, .55);
  }
  button:active {
    background: linear-gradient(#d9ab3c, #a97c1e);
    transform: translateY(1px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(96, 58, 0, .5), 0 1px 4px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
  <div class="topRow"><div id="cpuHand" class="hand"></div><div class="statusCol"><div id="status">あなたの番です</div><div id="statsLine"></div></div><div class="handSpacer"></div></div>
  <div id="board"></div>
  <div class="handRow"><div id="playerHand" class="hand"></div></div>
  <div class="bottomRow">
    <div class="btnGroup" id="rowPlay">
      <button id="restartBtn">はじめから</button><button id="undoBtn">待った</button><button id="hintBtn" class="subBtn">候補：オン</button><button id="soundBtn" class="subBtn">♪：オン</button><button id="settingsBtn" class="subBtn">設定</button>
    </div>
    <div class="btnGroup hidden" id="rowOver">
      <button id="restartBtn2">はじめから</button><button id="undoBtn2">待った</button><button id="reviewBtn" class="subBtn">感想戦</button><button id="settingsBtn2" class="subBtn">設定</button>
    </div>
    <div class="btnGroup hidden" id="rowReview">
      <button id="revPrev" class="subBtn">◀ 前へ</button><span id="revPos"></span><button id="revNext" class="subBtn">次へ ▶</button><button id="revExit" class="subBtn">戻る</button>
    </div>
  </div>
  <div class="bottomBlank"></div>
  <div id="promoOverlay" class="hidden">
    <div class="promoBox">
      <div id="promoText"></div>
      <div class="promoBtns"><button id="promoYes">成る</button><button id="promoNo">成らない</button></div>
    </div>
  </div>
  <div id="settingsOverlay" class="hidden">
    <div class="promoBox">
      <div class="boxTitle">設定</div>
      <div class="setRow"><span class="setLabel">CPUの強さ</span></div>
      <div class="promoBtns"><button data-diff="weak">弱い</button><button data-diff="normal">普通</button><button data-diff="strong">強い</button></div>
      <div class="promoBtns"><button id="settingsClose">閉じる</button></div>
    </div>
  </div>

<script>
"use strict";
/* ===== 純粋ロジック（検証可能にDOMと分離） ===== */
/* 駒に強弱はない。取れるかどうかは将棋の動きだけで決まる（valueはCPUの目安用） */
const TYPES = {
  king:   { kanji: "玉", name: "玉将", value: 100 },
  rook:   { kanji: "飛", name: "飛車", value: 50 },
  bishop: { kanji: "角", name: "角行", value: 45 },
  gold:   { kanji: "金", name: "金将", value: 30 },
  silver: { kanji: "銀", name: "銀将", value: 28 },
  knight: { kanji: "桂", name: "桂馬", value: 18 },
  lance:  { kanji: "香", name: "香車", value: 16 },
  pawn:   { kanji: "歩", name: "歩兵", value: 10 }
};
/* 駒の数は将棋と同じ（各20枚） */
const PIECE_SET = [
  ["king",1],["rook",1],["bishop",1],["gold",2],["silver",2],
  ["knight",2],["lance",2],["pawn",9]
];

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const inBoard = (r, c) => r >= 0 && r < 9 && c >= 0 && c < 9;
function pieceAt(pieces, r, c) {
  return pieces.find(p => p.row === r && p.col === c) || null;
}
const forwardOf = owner => (owner === "player" ? -1 : 1);

/* ===== 成り（将棋のルールどおり） ===== */
const PROMOTABLE = ["pawn", "lance", "knight", "silver", "bishop", "rook"];
const PROMO_INFO = {
  pawn:   { kanji: "と",   name: "と金" },
  lance:  { kanji: "成香", name: "成香" },
  knight: { kanji: "成桂", name: "成桂" },
  silver: { kanji: "成銀", name: "成銀" },
  bishop: { kanji: "馬",   name: "龍馬" },
  rook:   { kanji: "龍",   name: "龍王" }
};
function kanjiOf(piece) { return piece.promoted ? PROMO_INFO[piece.type].kanji : TYPES[piece.type].kanji; }
function nameOf(piece) { return piece.promoted ? PROMO_INFO[piece.type].name : TYPES[piece.type].name; }
/* 成った駒の実効的な動き：歩・香・桂・銀は金の動き、飛は龍、角は馬 */
function effectiveType(piece) {
  if (!piece.promoted) return piece.type;
  if (["pawn", "lance", "knight", "silver"].includes(piece.type)) return "gold";
  if (piece.type === "rook") return "dragon";
  if (piece.type === "bishop") return "horse";

          if (!pieceAt(view, r, c)) defSquares.add(r + "," + c);
          r += dr; c += dc;
        }
      }
      // 伏せ駒の一直線の王手についても、間のマスを合い駒候補に入れる
      for (const t of threats) {
        const dr = Math.sign(t.row - king.row), dc = Math.sign(t.col - king.col);
        let r = king.row + dr, c = king.col + dc;
        while (r !== t.row || c !== t.col) {
          if (!pieceAt(view, r, c)) defSquares.add(r + "," + c);
          r += dr; c += dc;
        }
      }
    }
  }
  for (const t of Object.keys(hands.cpu)) {
    if (!hands.cpu[t]) continue;
    const squares = legalDropSquares(view, "cpu", t);
    const scored = squares.map(s => {
      let s2 = 0;
      if (s.row >= 5) s2 += 3;
      if (defSquares.has(s.row + "," + s.col)) s2 += 100; // 守りのマスは必ず候補に残す
      for (const p of view) {
        if (p.owner === "player" && Math.abs(p.row - s.row) <= 1 && Math.abs(p.col - s.col) <= 1) s2 += 2;
      }

    if (!king) return false;
    return view.some(p => p.owner === "player" && p.revealed
      && legalMovesFor(p, view).some(m => m.row === king.row && m.col === king.col));

    if (!king || !dist) return [];
    const ids = [];
    for (const p of view) {

  // 守りの判定は、飛・角・香の筋が通っている場合と、取られる確率が高い場合に限る

  const kingCaptureDoomed = s => s.isKingCapture
    && (s.kingTh >= 0.5 || lineThreats(s.simState.pieces, state, dist).length > 0);

    if (nonTaboo.length) pool = nonTaboo;
  }

  // しれない」という推測にすぎない。除いた結果だけが残ると、かえって玉への
  // 具体的な脅威（kingTh）が明らかに大きい手しか残らないことがある。その場合は
  // 除外を採用せず、二手先読みの評価に委ねる
  // （2026-11-08に特定した不具合：銀の王手を推理で確定できていた局面で、
  // 「筋に残らない唯一の手」として、伏せ金の利きへ玉が自ら入る手だけが
  // 最終候補に残り、逃げ場があるのに「詰んだ」で終わる対局があった）
  const lineFilterSafe = (before, after) => {
    if (!after.length) return false;
    const bestBefore = Math.min(...before.map(s => s.kingTh));
    const bestAfter = Math.min(...after.map(s => s.kingTh));
    return bestAfter <= bestBefore + 0.25;
  };

  // 絞られるため、安全な手が読みの対象に入っていないと最後の砦がすり抜けてしまう。
  // 実際に起きた例：玉に逃げ場も合い駒もあったのに「詰んだ」で終わった対局があった
  {
    const nonOpen = pool.filter(s => !s.lineOpen || s.winsGame);
    if (lineFilterSafe(pool, nonOpen)) pool = nonOpen;

    deepPool = [...pool];
    const top = [...scoredCands].sort((a, b) => b.score - a.score).slice(0, level === "strong" ? 24 : 12);

  // 公開済みの王手への応手は、戒め・筋の除外よりも優先する。応手そのものが
  // 除外されると、王手がかかっているのに無関係な手を選んで自滅するため
  // （2026-11-06に特定）。ただし推理ベースの「ほぼ確実な王手」は対象外：
  // 伏せ駒のエサを玉で取る手まで応手として保護すると、罠の守りが崩れるため
  const isResolving = s => inRevealedCheck && s.resolves && s.resolvesStrong;
  // 戒めは読みの対象にも適用する（上位スコアで紛れ込んだ玉の取りを除く。他に手があれば）
  {
    const nonTaboo = deepPool.filter(s => !kingCaptureDoomed(s) || isResolving(s));
    if (nonTaboo.length) deepPool = nonTaboo;
  }

  // 玉が伏せ駒の筋に残る手は最終候補から外す（上位スコアで紛れ込んだ放置手を除く）。
  // ただしプールの段階と同じく、除いた結果の具体的な脅威が明らかに悪化するなら採用しない
  {

    const ds = level === "weak"
      ? (s.winsGame ? Infinity : s.score - (s.penalty || 0))
      : (s.winsGame ? Infinity : deepEvaluate(s.simState, state, dist, ev, probTable, level === "strong" ? 24 : 16)) - (s.penalty || 0);
    if (ds > bestDeep + 1e-9 || (Math.abs(ds - bestDeep) <= 1e-9 && s.score > bestScore)) {

  }

    const bp = view.find(p => p.id === best.pieceId);
    if (bp) { // 往復検知用に、その駒の直前の位置を記録する
      if (!state.cpuPrevByPiece) state.cpuPrevByPiece = {};
      state.cpuPrevByPiece[best.pieceId] = { fromRow: bp.row, fromCol: bp.col };

    const bp = AC.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = bpFreq;
    bp.Q.value = 1.1;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(sfxGain);
    src.start(t);
    const o = AC.createOscillator();
    o.type = "sine";
    o.frequency.value = 185;
    const og = AC.createGain();
    og.gain.setValueAtTime(vol * 0.45, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    o.connect(og); og.connect(sfxGain);
    o.start(t); o.stop(t + 0.1);
  }
  function sfxMove(captured, mine) {
    clickSound(captured ? 1150 : (mine ? 1950 : 1650), captured ? 0.95 : 0.7, 0.09);
  }
  function sfxReveal() { // 取って正体が分かる瞬間の、小さな琴のきらめき
    if (!AC || !soundOn) return;
    playPluck(kotoFreq(14), AC.currentTime, 0.30, sfxGain);
    playPluck(kotoFreq(16), AC.currentTime + 0.07, 0.20, sfxGain);
  }
  function sfxCheck() {
    if (!AC || !soundOn) return;
    playPluck(kotoFreq(12), AC.currentTime, 0.4, sfxGain);
  }
  function sfxEnd(result) {
    if (!AC || !soundOn) return;
    const t = AC.currentTime + 0.05;
    const seq = result === "win" ? [5, 7, 9, 12] : result === "loss" ? [9, 7, 5, 2] : [5, 7];
    seq.forEach((s, i) => playPluck(kotoFreq(s), t + i * 0.38, 0.55, sfxGain));
  }
  document.addEventListener("pointerdown", ensureAudio);

  function render() {
    boardEl.innerHTML = "";
    // 感想戦のときは記録した局面を表示する。最終手だけは答え合わせとして全駒公開で見せる
    const ds = reviewIdx != null ? gameLog[reviewIdx] : state;
    const isFinalReview = reviewIdx != null && reviewIdx === gameLog.length - 1;
    const dispPieces = isFinalReview ? ds.pieces.map(p => ({ ...p, revealed: true })) : ds.pieces;
    const moveMap = new Map(selectedMoves.map(m => [m.row + "," + m.col, m]));
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const p = pieceAt(dispPieces, r, c);
      const mv = moveMap.get(r + "," + c);
      if (mv) cell.classList.add(pieceAt(dispPieces, r, c) ? "attackable" : "movable");
      if (selected && p && p.id === selected.id) cell.classList.add("selected");
      if (hintPieceId && p && p.id === hintPieceId) cell.classList.add("hinted");
      if (lastMovePos && reviewIdx == null && r === lastMovePos.row && c === lastMovePos.col) cell.classList.add("lastMove");
      if (p) {
        const el = document.createElement("div");
        el.className = "piece " + p.owner;
        if (p.owner === "cpu") el.classList.add(p.revealed ? "known" : "hidden");
        if (p.promoted) el.classList.add("promoted");
        const span = document.createElement("span");
        const kanji = kanjiOf(p);
        span.textContent = kanji;
        if (kanji.length > 1) span.classList.add("small");
        el.appendChild(span);
        cell.appendChild(el);
      }
      cell.addEventListener("click", () => onCellClick(r, c));
      boardEl.appendChild(cell);
    }
    renderHands(ds);
    paintControlRow();
  }
  const HAND_ORDER = ["rook", "bishop", "gold", "silver", "knight", "lance", "pawn"];
  function renderHand(el, owner, selectable, ds) {
    el.innerHTML = "";
    const hands = ensureHands(ds)[owner];
    for (const t of HAND_ORDER) {
      const n = hands[t] || 0;
      if (!n) continue;
      const chip = document.createElement("span");
      chip.className = "chip" + (owner === "cpu" ? " cpu" : "") + (selectable ? " selectable" : "");
      if (selectable && selectedHand === t) chip.classList.add("selected");
      chip.textContent = TYPES[t].kanji + (n > 1 ? "×" + n : "");
      if (selectable) chip.addEventListener("click", () => onHandClick(t));
      el.appendChild(chip);
    }
  }
  function renderHands(ds) {
    renderHand(document.getElementById("cpuHand"), "cpu", false, ds);
    renderHand(document.getElementById("playerHand"), "player", true, ds);
  }
  function onHandClick(type) {
    if (busy || over || pendingPromo) return;
    hintPieceId = null;
    if (selectedHand === type) {
      selectedHand = null; selectedMoves = [];
    } else {
      selectedHand = type; selected = null;
      selectedMoves = legalDropSquares(state.pieces, "player", type);
    }
    render();
  }
  function endGame(result, reason) {
    over = true;
    endResult = result;
    // 勝ったときだけ、盤と勝敗表示を金色に輝かせる（見た目だけの演出）
    document.body.classList.toggle("won", result === "player");
    statusEl.classList.toggle("win", result === "player");
    // 終局したら全ての駒を公開する（答え合わせ。詰みの理由を盤面で確かめられるように）
    for (const p of state.pieces) p.revealed = true;
    // 戦績に記録する（1局につき1回だけ。待ったで終局を取り消したら記録も戻す）
    if (!recorded) {
      recorded = true; lastResult = result; lastDay = todayKey();
      bumpStats(stats, result, lastDay, +1); saveStats(); updateStatsLine();
    }
    sfxEnd(result === "player" ? "win" : result === "cpu" ? "loss" : "draw");
    if (result === "draw") {
      statusEl.textContent = "🤝 千日手（同じ局面が4回）で引き分け";
      overStatusText = statusEl.textContent;
      render();
      return;
    }
    if (reason === "詰み") {
      // 決め手の王手駒を名指しする（詰んだ側の玉に利いている駒）
      const loser = result === "player" ? "cpu" : "player";
      const names = checkingPieces(state, loser).map(pieceDisplayName);
      const suffix = names.length ? `（${names.join("と")}の王手）` : "";
      statusEl.textContent =
        result === "player" ? `🏆 あなたの勝ち！ CPUの玉が詰んだ${suffix}` :
        `CPUの勝ち… あなたの玉が詰んだ${suffix}`;
    } else {
      statusEl.textContent =
        result === "player" ? "🏆 あなたの勝ち！ CPUの玉を取った" :
        "CPUの勝ち… あなたの玉が取られた";
      if (reason) statusEl.textContent += `（${reason}）`;
    }
    overStatusText = statusEl.textContent;
    render();
  }
  function checkNoMoves(owner) {
    return !hasLegalAction(state, owner);
  }
  // 千日手：手番が nextTurn に移った局面を記録し、同じ局面が4回目なら引き分けで終局する
  function checkRepetition(nextTurn) {
    const key = positionKey(state, nextTurn);
    posCounts[key] = (posCounts[key] || 0) + 1;
    if (posCounts[key] >= 4) { endGame("draw"); return true; }
    return false;
  }
  function onCellClick(r, c) {
    if (busy || over || pendingPromo) return;
    const clicked = pieceAt(state.pieces, r, c);
    // 持ち駒を打つ
    if (selectedHand) {
      if (!clicked) {
        if (selectedMoves.some(m => m.row === r && m.col === c)) { doPlayerDrop(selectedHand, { row: r, col: c }); return; }
        statusEl.textContent = "そこには打てません";
        return;
      }
      if (clicked.owner === "player") {
        selectedHand = null;
        selected = clicked;
        selectedMoves = legalMovesFor(clicked, state.pieces);
        render();
      }
      return;
    }
    const mv = selectedMoves.find(m => m.row === r && m.col === c);
    if (selected && mv) { doPlayerMove(selected, mv); return; }
    if (clicked && clicked.owner === "player") {
      selected = clicked;
      selectedMoves = legalMovesFor(clicked, state.pieces);
      hintPieceId = null;
    } else if (clicked && clicked.owner === "cpu" && !clicked.revealed && hintOn) {
      // 伏せ駒をタップしたら、正体の候補を推理して表示する
      // （自分の駒の取り先として選ばれている場合は、上の分岐で取る処理が先に動く）
      selected = null; selectedMoves = [];
      hintPieceId = clicked.id;
    } else {
      selected = null; selectedMoves = [];
      hintPieceId = null;
    }
    render();
    if (hintPieceId) {
      const hp = state.pieces.find(p => p.id === hintPieceId);
      if (hp) statusEl.textContent = hintText(hp);
    }
  }
  function doPlayerDrop(type, to) {
    hintPieceId = null;
    // 王手がかかっているときは、玉が助からない打ちはできない（まず知らせる）
    if (kingAttackedReal(state.pieces, "player") && selfCheckAfterDrop(state, "player", type, to.row, to.col)) {
      selectedHand = null; selected = null; selectedMoves = [];
      statusEl.textContent = "王手です！ その打ち方では玉が助かりません";
      render();
      return;
    }
    pushUndo();
    if (!dropPiece(state, "player", type, to.row, to.col)) { undoStack.pop(); return; }
    sfxMove(false, true);
    lastMovePos = { row: to.row, col: to.col };
    pushLog();
    selectedHand = null; selected = null; selectedMoves = [];
    if (isMated(state, "cpu")) { endGame("player", "詰み"); return; }
    if (checkNoMoves("cpu")) { endGame("player", "CPUに動かせる駒がなくなった"); return; }
    if (checkRepetition("cpu")) return;
    busy = true;
    statusEl.textContent = "CPUの番です…";
    render();
    scheduleCpu();
  }
  function doPlayerMove(piece, to) {
    const fromRow = piece.row;
    if (canPromote(piece, fromRow, to.row)) {
      if (mustPromote(piece, to.row)) { executePlayerMove(piece, to, true); return; }
      // 成るかどうかを聞く（将棋のルールどおり選択できる）
      pendingPromo = { piece, to };
      selected = null; selectedMoves = [];
      promoText.textContent = `${TYPES[piece.type].name}を成りますか？`;
      promoOverlay.classList.remove("hidden");
      render();
      return;
    }
    executePlayerMove(piece, to, false);
  }
  function executePlayerMove(piece, to, promote) {
    hintPieceId = null;
    // 王手がかかっているときは、玉が助からない手は指せない（まず知らせる）
    if (kingAttackedReal(state.pieces, "player") && selfCheckAfterMove(state, piece, to, promote)) {
      selected = null; selectedMoves = []; selectedHand = null;
      statusEl.textContent = "王手です！ その手では玉が助かりません";
      render();
      return;
    }
    pushUndo();
    const res = applyMove(state, piece, to, promote);
    if (res.battle) { sfxMove(true, true); sfxReveal(); } else sfxMove(false, true);
    lastMovePos = { row: to.row, col: to.col };
    pushLog();
    selected = null; selectedMoves = []; selectedHand = null;
    if (res.gameResult) { endGame(res.gameResult); return; }
    // 自分の手を指した結果、自分の玉が取られる状態のままなら詰み（負け）
    if (kingAttackedReal(state.pieces, "player")) { endGame("cpu", "詰み"); return; }
    if (isMated(state, "cpu")) { endGame("player", "詰み"); return; }
    if (checkNoMoves("cpu")) { endGame("player", "CPUに動かせる駒がなくなった"); return; }
    if (checkRepetition("cpu")) return;
    busy = true;
    // 取ったことは盤面と持ち駒で分かるので、文言は出さず通常の手番表示だけにする
    let msg = "CPUの番です…";
    if (promote) msg += `（${nameOf(piece)}に成った）`;
    statusEl.textContent = msg;
    render();
    scheduleCpu();
  }
  function doCpuMove() {
    hintPieceId = null;
    if (isMated(state, "cpu")) { busy = false; endGame("player", "詰み"); return; }
    const act = cpuChooseAction(state, undefined, difficulty);
    if (!act) { busy = false; endGame("player", "CPUに動かせる駒がなくなった"); return; }
    busy = false;
    if (act.kind === "drop") {
      dropPiece(state, "cpu", act.type, act.to.row, act.to.col);
      sfxMove(false, false);
      lastMovePos = { row: act.to.row, col: act.to.col };
      pushLog();
      if (isMated(state, "player")) { endGame("cpu", "詰み"); return; }
      if (checkNoMoves("player")) { endGame("cpu", "あなたに動かせる駒がなくなった"); return; }
      if (checkRepetition("player")) return;
      const inCheckNow = kingAttackedReal(state.pieces, "player");
      if (inCheckNow) sfxCheck();
      statusEl.textContent = (inCheckNow ? "王手です！ " : "")
        + "CPUが駒を打った（何を打ったかは伏せてある）";
      render();
      return;
    }
    const res = applyMove(state, act.piece, act.to, act.promote);
    if (res.battle) { sfxMove(true, false); sfxReveal(); } else sfxMove(false, false);
    lastMovePos = { row: act.to.row, col: act.to.col };
    pushLog();
    if (res.gameResult) { endGame(res.gameResult); return; }
    // 自分の手を指した結果、自分の玉が取られる状態のままなら詰み（負け）
    if (kingAttackedReal(state.pieces, "cpu")) { endGame("player", "詰み"); return; }
    if (isMated(state, "player")) { endGame("cpu", "詰み"); return; }
    if (checkNoMoves("player")) { endGame("cpu", "あなたに動かせる駒がなくなった"); return; }
    if (checkRepetition("player")) return;
    let msg = "あなたの番です";
    if (act.promote && act.piece.revealed) msg += `（${nameOf(act.piece)}に成った）`;
    // 王手がかかっていたら、手番の表示でも知らせる（伏せ駒の王手は見た目では分からないため）
    if (kingAttackedReal(state.pieces, "player")) { msg = "王手です！ " + msg; sfxCheck(); }
    statusEl.textContent = msg;
    render();
  }
  function answerPromo(promote) {
    if (!pendingPromo) return;
    const { piece, to } = pendingPromo;
    pendingPromo = null;
    promoOverlay.classList.add("hidden");
    executePlayerMove(piece, to, promote);
  }
  document.getElementById("promoYes").addEventListener("click", () => answerPromo(true));
  document.getElementById("promoNo").addEventListener("click", () => answerPromo(false));
  function undo() {
    if (pendingPromo || reviewIdx != null || !undoStack.length) return;
    turnSeq++; // 予約済みのCPUの手を取り消す（CPUの思考中でも待ったできる）
    const entry = undoStack.pop();
    // 終局していた対局を戻すときは、戦績の記録も取り消す
    if (recorded && lastResult) { bumpStats(stats, lastResult, lastDay, -1); saveStats(); recorded = false; lastResult = null; }
    const restored = restoreState(entry.snap);
    state = restored.state;
    posCounts = restored.posCounts;
    gameLog.length = entry.logLen; // 感想戦の記録も、戻した時点までに切り詰める
    over = false; busy = false;
    selected = null; selectedMoves = []; selectedHand = null; hintPieceId = null;
    lastMovePos = null;
    endResult = null;
    document.body.classList.remove("won");
    statusEl.classList.remove("win");
    promoOverlay.classList.add("hidden");
    statusEl.textContent = "待った！ あなたの番です";
    updateStatsLine();
    render();
  }
  // ===== 感想戦：終局後に全手を1手ずつたどる =====
  function reviewStatus() {
    if (reviewIdx === 0) return "感想戦：開始局面";
    const who = reviewIdx % 2 === 1 ? "あなたの手" : "CPUの手";
    let s = `感想戦：${reviewIdx}手目（${who}）`;
    if (reviewIdx === gameLog.length - 1) s += " ― 最終局面（全ての駒を公開）";
    return s;
  }
  function enterReview() {
    if (!over || gameLog.length < 2) return;
    reviewIdx = gameLog.length - 1;
    selected = null; selectedMoves = []; selectedHand = null; hintPieceId = null;
    // 感想戦の間は勝利の輝きを落として、落ち着いて振り返れるようにする
    document.body.classList.remove("won");
    statusEl.classList.remove("win");
    statusEl.textContent = reviewStatus();
    render();
  }
  function stepReview(d) {
    if (reviewIdx == null) return;
    reviewIdx = Math.max(0, Math.min(gameLog.length - 1, reviewIdx + d));
    statusEl.textContent = reviewStatus();
    render();
  }
  function exitReview() {
    if (reviewIdx == null) return;
    reviewIdx = null;
    document.body.classList.toggle("won", endResult === "player");
    statusEl.classList.toggle("win", endResult === "player");
    statusEl.textContent = overStatusText;
    render();
  }
  function start() {
    turnSeq++; // 前の対局で予約されたCPUの手があれば取り消す
    state = newGameState();
    posCounts = {};
    posCounts[positionKey(state, "player")] = 1; // 初期局面も1回目として数える
    selected = null; selectedMoves = []; busy = false; over = false; pendingPromo = null; selectedHand = null; hintPieceId = null;
    lastMovePos = null;
    document.body.classList.remove("won");
    statusEl.classList.remove("win");
    undoStack = [];
    gameLog = [snapshotState(state, posCounts)];
    reviewIdx = null; overStatusText = ""; endResult = null;
    recorded = false; lastResult = null;
    promoOverlay.classList.add("hidden");
    settingsOverlay.classList.add("hidden");
    statusEl.textContent = "あなたの番です";
    updateStatsLine();
    render();
  }
  document.getElementById("restartBtn").addEventListener("click", start);
  document.getElementById("restartBtn2").addEventListener("click", start);
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("undoBtn2").addEventListener("click", undo);
  document.getElementById("reviewBtn").addEventListener("click", enterReview);
  document.getElementById("revPrev").addEventListener("click", () => stepReview(-1));
  document.getElementById("revNext").addEventListener("click", () => stepReview(1));
  document.getElementById("revExit").addEventListener("click", exitReview);
  // ===== 音のオン/オフ =====
  const soundBtn = document.getElementById("soundBtn");
  function syncSoundBtn() {
    soundBtn.textContent = soundOn ? "♪：オン" : "♪：オフ";
    soundBtn.classList.toggle("off", !soundOn);
  }
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("fuseSound", soundOn ? "on" : "off"); } catch (e) {}
    syncSoundBtn();
    if (!soundOn && AC) AC.suspend();
    if (soundOn) ensureAudio();
  });
  syncSoundBtn();
  // ===== 設定（CPUの強さ） =====
  function paintDiffBtns() {
    const labels = { weak: "弱い", normal: "普通", strong: "強い" };
    settingsOverlay.querySelectorAll("[data-diff]").forEach(b => {
      const d = b.getAttribute("data-diff");
      b.textContent = (d === difficulty ? "✓" : "") + labels[d];
    });
  }
  function openSettings() { paintDiffBtns(); settingsOverlay.classList.remove("hidden"); }
  settingsOverlay.querySelectorAll("[data-diff]").forEach(b => b.addEventListener("click", () => {
    difficulty = b.getAttribute("data-diff");
    try { localStorage.setItem("fuseDiff", difficulty); } catch (e) {}
    paintDiffBtns();
  }));
  document.getElementById("settingsClose").addEventListener("click", () => settingsOverlay.classList.add("hidden"));
  settingsOverlay.addEventListener("click", (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.add("hidden"); });
  document.getElementById("settingsBtn").addEventListener("click", openSettings);
  document.getElementById("settingsBtn2").addEventListener("click", openSettings);
  const hintBtn = document.getElementById("hintBtn");
  function syncHintBtn() {
    hintBtn.textContent = hintOn ? "候補：オン" : "候補：オフ";
    hintBtn.classList.toggle("off", !hintOn);
  }
  hintBtn.addEventListener("click", () => {
    const wasShowing = !!hintPieceId;
    hintOn = !hintOn;
    if (!hintOn) hintPieceId = null;
    try { localStorage.setItem("fuseHint", hintOn ? "on" : "off"); } catch (e) {}
    syncHintBtn();
    render();
    if (!hintOn && wasShowing && !busy && !over) statusEl.textContent = "あなたの番です";
  });
  syncHintBtn();
  start();
}
</script>
</body>
</html>
